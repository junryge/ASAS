<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KIM - 그래프 에이전트</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --panel: #1a1a2e;
      --card: #252545;
      --accent: #ff6b6b;
      --accent2: #ee5a24;
      --text: #f0e6e6;
      --muted: #aa8888;
      --success: #2ecc71;
      --border: #3a2a2a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: var(--panel);
      border-bottom: 2px solid var(--border);
      padding: 16px 24px;
      display: flex; align-items: center; gap: 16px;
    }
    .header .avatar {
      width: 48px; height: 48px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: grid; place-items: center;
      font-size: 22px; font-weight: 700;
    }
    .header .info h1 { font-size: 20px; }
    .header .info p { font-size: 13px; color: var(--muted); }
    .header .status {
      margin-left: auto;
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--success);
    }
    .header .status::before {
      content: ''; width: 8px; height: 8px; border-radius: 50%;
      background: var(--success); animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .main { flex:1; display:grid; grid-template-columns:280px 1fr; overflow:hidden; }

    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 20px; overflow-y: auto;
    }
    .sidebar h3 {
      font-size: 13px; text-transform: uppercase;
      letter-spacing: 1px; color: var(--muted); margin-bottom: 12px;
    }
    .tool-list { list-style: none; }
    .tool-list li {
      padding: 10px 12px; border-radius: 8px; margin-bottom: 6px;
      cursor: pointer; transition: background 0.2s;
      display: flex; align-items: center; gap: 10px; font-size: 14px;
    }
    .tool-list li:hover { background: var(--card); }
    .tool-list li .icon {
      width: 32px; height: 32px; border-radius: 6px;
      background: var(--card); display: grid; place-items: center; font-size: 16px;
    }
    .tool-list li.active { background: rgba(255,107,107,0.15); border: 1px solid rgba(255,107,107,0.3); }

    .chart-types { margin-top: 24px; }
    .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .chart-type-btn {
      padding: 12px;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      text-align: center;
      font-size: 13px;
      font-family: inherit;
      transition: all 0.2s;
    }
    .chart-type-btn:hover { border-color: var(--accent); }
    .chart-type-btn .icon { font-size: 24px; display: block; margin-bottom: 4px; }

    .content { display: flex; flex-direction: column; overflow: hidden; }

    /* Chart Display Area */
    .chart-display {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }
    .chart-placeholder {
      flex: 1;
      min-height: 400px;
      background: var(--card);
      border-radius: 12px;
      border: 2px dashed var(--border);
      display: grid;
      place-items: center;
    }
    .chart-placeholder .inner { text-align: center; color: var(--muted); }
    .chart-placeholder .big-icon { font-size: 64px; display: block; margin-bottom: 12px; }

    /* Sample mini charts */
    .sample-charts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .sample-chart {
      background: var(--card);
      border-radius: 10px;
      padding: 16px;
      border: 1px solid var(--border);
    }
    .sample-chart .title { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .sample-chart .bars {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 60px;
    }
    .sample-chart .bar {
      flex: 1;
      border-radius: 3px 3px 0 0;
      transition: height 0.5s;
    }

    .chat-area { max-height: 200px; overflow-y: auto; padding: 12px 24px; }
    .message { margin-bottom: 12px; display: flex; gap: 10px; }
    .message .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--card); display: grid; place-items: center;
      font-size: 14px; flex-shrink: 0;
    }
    .message .msg-avatar.agent { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .message .msg-body {
      background: var(--card); border-radius: 10px;
      padding: 10px 14px; max-width: 70%; font-size: 13px; line-height: 1.5;
    }
    .message.user { flex-direction: row-reverse; }
    .message.user .msg-body { background: var(--accent2); }

    .input-bar {
      padding: 12px 24px; background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex; gap: 12px; align-items: center;
    }
    .input-bar input {
      flex: 1; padding: 10px 14px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--text); font-size: 14px; font-family: inherit; outline: none;
    }
    .input-bar input:focus { border-color: var(--accent); }
    .input-bar input::placeholder { color: var(--muted); }
    .input-bar button {
      padding: 10px 18px; border-radius: 10px; border: none;
      background: var(--accent); color: #fff;
      font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .input-bar button:hover { background: var(--accent2); }
  </style>
</head>
<body>

  <div class="header">
    <div class="avatar">K</div>
    <div class="info">
      <h1>KIM - 그래프 에이전트</h1>
      <p>차트 생성 / 막대·꺾은선·원형·산점도 / 데이터 시각화 / 이미지 내보내기</p>
    </div>
    <div class="status">대기 중</div>
  </div>

  <div class="main">
    <div class="sidebar">
      <h3>그래프 도구</h3>
      <ul class="tool-list">
        <li class="active">
          <div class="icon">📊</div>
          <div>차트 생성</div>
        </li>
        <li>
          <div class="icon">📁</div>
          <div>데이터 업로드</div>
        </li>
        <li>
          <div class="icon">🎨</div>
          <div>스타일 설정</div>
        </li>
        <li>
          <div class="icon">📤</div>
          <div>이미지 내보내기</div>
        </li>
      </ul>

      <div class="chart-types">
        <h3>차트 유형</h3>
        <div class="chart-grid">
          <button class="chart-type-btn"><span class="icon">📊</span>막대</button>
          <button class="chart-type-btn"><span class="icon">📈</span>꺾은선</button>
          <button class="chart-type-btn"><span class="icon">🥧</span>원형</button>
          <button class="chart-type-btn"><span class="icon">🔵</span>산점도</button>
          <button class="chart-type-btn"><span class="icon">📉</span>영역</button>
          <button class="chart-type-btn"><span class="icon">🌡️</span>히트맵</button>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="chart-display">
        <div class="chart-placeholder">
          <div class="inner">
            <span class="big-icon">📊</span>
            <div>그래프 생성 요청을 입력하면<br>이곳에 차트가 표시됩니다</div>
          </div>
        </div>

        <div class="sample-charts">
          <div class="sample-chart">
            <div class="title">월별 생산량 (샘플)</div>
            <div class="bars" id="bars1"></div>
          </div>
          <div class="sample-chart">
            <div class="title">설비 가동률 (샘플)</div>
            <div class="bars" id="bars2"></div>
          </div>
          <div class="sample-chart">
            <div class="title">불량률 (샘플)</div>
            <div class="bars" id="bars3"></div>
          </div>
        </div>
      </div>

      <div class="chat-area" id="chatArea"></div>

      <div class="input-bar">
        <input type="text" id="userInput" placeholder="그래프 요청을 입력하세요... (예: 월별 매출 추이 꺾은선 그래프 만들어줘)"
               onkeydown="if(event.key==='Enter') sendMsg()" />
        <button onclick="sendMsg()">차트 생성</button>
      </div>
    </div>
  </div>

  <script>
    // Animated sample bars
    const colors = [
      ['#ff6b6b','#ee5a24','#ff9ff3','#feca57','#48dbfb','#ff6348'],
      ['#2ecc71','#27ae60','#1abc9c','#16a085','#2ecc71','#27ae60'],
      ['#e17055','#d63031','#e17055','#fdcb6e','#e17055','#d63031']
    ];
    ['bars1','bars2','bars3'].forEach((id, gi) => {
      const el = document.getElementById(id);
      for (let i = 0; i < 6; i++) {
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.background = colors[gi][i];
        bar.style.height = (20 + Math.random() * 80) + '%';
        el.appendChild(bar);
      }
    });

    // Animate bars periodically
    setInterval(() => {
      document.querySelectorAll('.bar').forEach(b => {
        b.style.height = (20 + Math.random() * 80) + '%';
      });
    }, 3000);

    function sendMsg() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;
      const chatArea = document.getElementById('chatArea');
      chatArea.innerHTML += `
        <div class="message user">
          <div class="msg-avatar">👤</div>
          <div class="msg-body">${escapeHtml(text)}</div>
        </div>`;
      input.value = '';
      setTimeout(() => {
        chatArea.innerHTML += `
          <div class="message">
            <div class="msg-avatar agent">K</div>
            <div class="msg-body">
              차트 생성 요청 접수: <strong>"${escapeHtml(text)}"</strong><br>
              ⏳ 백엔드 연결 후 실제 차트가 생성됩니다.
            </div>
          </div>`;
        chatArea.scrollTop = chatArea.scrollHeight;
      }, 500);
      chatArea.scrollTop = chatArea.scrollHeight;
    }
    function escapeHtml(t) {
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }
  </script>
</body>
</html>
