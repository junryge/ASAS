# ============================================================
# 니 PC 클라이언트 설정 (MCP 클라이언트 + LLM 호출)
# ============================================================

# 폐쇄망 내부 LLM (vLLM / OpenAI 호환 API)
llm:
  base_url: "http://10.0.0.50:8000/v1"   # vLLM 서버 주소로 수정
  model: "Qwen2.5-72B-Instruct"          # 서빙 중인 모델명으로 수정
  # API 키는 아래 순서로 찾는다 (따로 관리 가능):
  #  1. 환경변수 LLM_API_KEY
  #  2. api_key_file 에 지정한 파일 (한 줄짜리 키 파일)
  #  3. 여기 api_key 값
  api_key_file: "api_key.txt"             # 키 파일 경로 (이 폴더 기준)
  api_key: "EMPTY"                        # 키 없으면 vLLM 기본값 EMPTY
  temperature: 0.2
  timeout: 120

# 서버 PC의 MCP 게이트웨이
gateway:
  url: "http://10.0.0.10:8010/mcp"       # 서버 PC IP로 수정

# LLM이 tool을 연속 호출할 수 있는 최대 횟수
max_tool_rounds: 5

system_prompt: |
  너는 폐쇄망 내부 데이터 조회 보조 AI다.
  필요하면 제공된 tool(REST·DB·파일·MCP중계)을 호출해서 실제 데이터 기반으로 답해라.
  tool 결과에 없는 내용은 지어내지 마라.
