# Nomos LLM 설정 파일
# API URL 및 모델 설정을 이 파일에서 관리합니다.
# 이 파일을 수정한 후 앱을 재시작하거나, 헤더의 토큰 갱신 버튼을 누르세요.

[dev]
url = http://dev.assistant.llm.skhynix.com/v1/chat/completions
model = Qwen3-Coder-30B-A3B-Instruct
name = DEV(30B)
max_tokens = 8192

[prod]
url = http://summary.llm.skhynix.com/v1/chat/completions
model = Qwen3-Next-80B-A3B-Instruct
name = PROD(80B)
max_tokens = 8192

[common]
url = http://common.llm.skhynix.com/v1/chat/completions
model = gpt-oss-20b
name = COMMON(20B)
max_tokens = 4096

[local]
url = http://localhost:10007/v1/chat/completions
model = Qwen3-14B-Q4_K_M
name = LOCAL(14B-GGUF)
max_tokens = 4096
port = 10007
