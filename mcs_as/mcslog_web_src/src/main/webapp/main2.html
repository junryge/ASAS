<body>
<a id="downloadLink" download="Report.xlsx" href="">Download Excel</a>

<table width="100%">
  <tr>
    <td valign="top" width="50%">
      <div style="border:1px solid gray;background:wheat;padding:6px;">
        <label>Show tasks with % at least: </label>

        <div style="padding:4px;">
          <div style="width:100px;" id="pcSlider"></div>
        </div>
        <br/>
        <label>And title including:</label>
        <input type=text id="txtSearch">
      </div>
      <br/>

      <div id="myGrid" style="width:600px;height:500px;"></div>
    </td>
    <td valign="top">
      <h2>Demonstrates:</h2>
      <ul>
        <li>implementing expand/collapse as a filter for DataView</li>
      </ul>

        <h2>View Source:</h2>
        <ul>
            <li><A href="https://github.com/mleibman/SlickGrid/blob/gh-pages/examples/example5-collapsing.html" target="_sourcewindow"> View the source for this example on Github</a></li>
        </ul>
    </td>
  </tr>
</table>

<script>

var dataView;
var grid;
var data = [];
var columns = [
  {id: "title", name: "Title", field: "title", width: 220, cssClass: "cell-title", formatter: TaskNameFormatter, editor: Slick.Editors.Text, validator: requiredFieldValidator},
  {id: "duration", name: "Duration", field: "duration", editor: Slick.Editors.Text},
  {id: "%", name: "% Complete", field: "percentComplete", width: 80, resizable: false, formatter: Slick.Formatters.PercentCompleteBar, editor: Slick.Editors.PercentComplete},
  {id: "start", name: "Start", field: "start", minWidth: 60, editor: Slick.Editors.Date},
  {id: "finish", name: "Finish", field: "finish", minWidth: 60, editor: Slick.Editors.Date},
  {id: "effort-driven", name: "Effort Driven", width: 80, minWidth: 20, maxWidth: 80, cssClass: "cell-effort-driven", field: "effortDriven", formatter: Slick.Formatters.Checkmark, editor: Slick.Editors.Checkbox, cannotTriggerInsert: true}
];
var options = {
  editable: true,
  enableAddRow: true,
  enableCellNavigation: true,
  asyncEditorLoading: false
};
var percentCompleteThreshold = 0;
var searchString = "";

  //default excel options
var excelOptions = {
    headerStyle: {
        font: {
            bold: true,  //enable bold
            font: 12, // font size
            color: '00ffffff' //font color --Note: Add 00 before the color code
        },
        fill: {   //fill background
            type: 'pattern', 
            patternType: 'solid',
            fgColor: '00428BCA' //background color --Note: Add 00 before the color code
        }
    },
    cellStyle: {
        font: {
            bold: false,  //enable bold
            font: 12, // font size
            color: '00000000' //font color --Note: Add 00 before the color code
        },
        fill: {   //fill background
            type: 'pattern',
            patternType: 'solid',
            fgColor: '00ffffff' //background color --Note: Add 00 before the color code
        }
    },
};
var excelData = [];
$(function () {
  var data = [];
  for (var i = 0; i < 500; i++) {
    data[i] = {
      title: "Task " + i,
      duration: "5 days",
      percentComplete: Math.round(Math.random() * 100),
      start: "01/01/2009",
      finish: "01/05/2009",
      effortDriven: (i % 5 == 0)
    };
  }

  grid = new Slick.Grid("#myGrid", data, columns, options);

  $('body').exportToExcel("Report.xlsx", "Report", data, excelOptions, function (response) {
      console.log(response);
  });
})

</script>
</body>
