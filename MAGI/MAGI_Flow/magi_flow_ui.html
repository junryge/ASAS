<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ MAGI Flow - Visual Workflow Builder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0f1a;--surface:#1a1a2e;--surface2:#252542;--border:#333360;
  --primary:#6366f1;--primary-glow:#6366f180;--accent:#8b5cf6;
  --success:#10b981;--warning:#f59e0b;--danger:#ef4444;--info:#3b82f6;
  --text:#e2e8f0;--muted:#64748b;--white:#fff;
}
body{font-family:'Segoe UI',-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh}

/* ===== 레이아웃 ===== */
.app{display:flex;height:100vh}
.sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.canvas-area{flex:1;position:relative;overflow:hidden}
.properties-panel{width:300px;background:var(--surface);border-left:1px solid var(--border);display:none;flex-direction:column;overflow-y:auto}
.properties-panel.open{display:flex}

/* ===== 사이드바 ===== */
.sidebar-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sidebar-header h1{font-size:18px;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sidebar-header .version{font-size:11px;color:var(--muted);padding:2px 6px;background:var(--surface2);border-radius:4px}

.sidebar-section{padding:12px 16px 6px;font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:1px}
.node-palette{padding:4px 8px;flex:1;overflow-y:auto}
.node-item{padding:10px 12px;margin:3px 0;border-radius:8px;cursor:grab;background:var(--surface2);border:1px solid transparent;transition:all .15s;display:flex;align-items:center;gap:8px;font-size:13px}
.node-item:hover{border-color:var(--primary);background:var(--primary)10;transform:translateX(2px)}
.node-item:active{cursor:grabbing}
.node-item .icon{font-size:16px;width:24px;text-align:center}
.node-item .desc{font-size:10px;color:var(--muted);margin-top:2px}

/* ===== MAGI 연결 상태 ===== */
.magi-status{padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:12px}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex-shrink:0}
.status-dot.connected{background:var(--success);box-shadow:0 0 6px var(--success)}

/* ===== 캔버스 ===== */
.canvas-container{width:100%;height:100%;position:relative}
#canvas{width:100%;height:100%;position:absolute;top:0;left:0}
.grid-bg{background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);background-size:24px 24px}

/* ===== 툴바 ===== */
.toolbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;z-index:100;box-shadow:0 4px 12px #0003}
.toolbar button{padding:6px 14px;border:none;border-radius:8px;background:var(--surface2);color:var(--text);font-size:13px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px}
.toolbar button:hover{background:var(--primary);color:var(--white)}
.toolbar button.run-btn{background:var(--success);color:var(--white)}
.toolbar button.run-btn:hover{background:#059669}
.toolbar .sep{width:1px;background:var(--border);margin:0 4px}

/* ===== 노드 (캔버스 위) ===== */
.flow-node{position:absolute;min-width:180px;background:var(--surface2);border:2px solid var(--border);border-radius:12px;cursor:move;z-index:10;user-select:none;transition:box-shadow .15s}
.flow-node:hover{box-shadow:0 0 20px var(--primary-glow)}
.flow-node.selected{border-color:var(--primary);box-shadow:0 0 20px var(--primary-glow)}
.flow-node.running{border-color:var(--warning);box-shadow:0 0 16px var(--warning)40;animation:pulse 1s infinite}
.flow-node.done{border-color:var(--success)}
.flow-node.error{border-color:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.8}}

.node-header{padding:8px 12px;border-radius:10px 10px 0 0;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:move}
.node-header .icon{font-size:15px}
.node-header .close-btn{margin-left:auto;opacity:.4;cursor:pointer;font-size:14px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:4px}
.node-header .close-btn:hover{opacity:1;background:var(--danger);color:var(--white)}

.node-body{padding:8px 12px 10px;font-size:11px;color:var(--muted)}
.node-body .config-preview{max-height:40px;overflow:hidden;word-break:break-all}

/* 포트 (연결점) */
.port{width:12px;height:12px;border-radius:50%;background:var(--border);border:2px solid var(--surface2);position:absolute;cursor:crosshair;z-index:20;transition:all .15s}
.port:hover{background:var(--primary);transform:scale(1.3)}
.port.input{left:-6px;top:50%}
.port.output{right:-6px;top:50%}
.port.output-true{right:-6px;top:35%;background:var(--success)}
.port.output-false{right:-6px;top:65%;background:var(--danger)}

/* 노드 카테고리별 색상 */
.flow-node[data-category="기본"] .node-header{background:var(--info)20;color:var(--info)}
.flow-node[data-category="MAGI"] .node-header{background:var(--accent)20;color:var(--accent)}
.flow-node[data-category="연동"] .node-header{background:var(--warning)20;color:var(--warning)}
.flow-node[data-category="처리"] .node-header{background:var(--success)20;color:var(--success)}
.flow-node[data-category="흐름"] .node-header{background:#ec489920;color:#ec4899}
.flow-node[data-category="GGUF"] .node-header{background:#f9731620;color:#f97316}
.flow-node[data-category="API"] .node-header{background:#06b6d420;color:#06b6d4}
.flow-node[data-category="설정"] .node-header{background:#a78bfa20;color:#a78bfa}

/* ===== 연결선 (SVG) ===== */
.edge-line{fill:none;stroke:var(--border);stroke-width:2;transition:stroke .15s}
.edge-line:hover{stroke:var(--primary);stroke-width:3;cursor:pointer}
.edge-line.active{stroke:var(--warning);stroke-width:2.5;stroke-dasharray:8 4;animation:dash .5s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
.edge-line.done{stroke:var(--success)}

/* ===== 속성 패널 ===== */
.prop-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:between}
.prop-header h3{font-size:14px;flex:1}
.prop-header .close{cursor:pointer;opacity:.5;font-size:18px}
.prop-header .close:hover{opacity:1}
.prop-group{padding:12px 16px}
.prop-group label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.prop-group input,.prop-group textarea,.prop-group select{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-family:inherit;resize:vertical}
.prop-group input:focus,.prop-group textarea:focus,.prop-group select:focus{outline:none;border-color:var(--primary)}
.prop-group textarea{min-height:80px;font-family:'Cascadia Code','Fira Code',monospace;font-size:12px}

/* ===== 실행 결과 패널 ===== */
.result-panel{position:absolute;bottom:0;left:260px;right:0;max-height:250px;background:var(--surface);border-top:1px solid var(--border);z-index:100;overflow-y:auto;display:none}
.result-panel.open{display:block}
.result-header{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
.result-header h3{font-size:13px}
.result-body{padding:12px 16px;font-family:'Cascadia Code',monospace;font-size:12px;white-space:pre-wrap;line-height:1.6}

/* ===== 미니맵 ===== */
.minimap{position:absolute;bottom:16px;right:16px;width:160px;height:100px;background:var(--surface);border:1px solid var(--border);border-radius:8px;z-index:50;opacity:.7}

/* ===== 줌 컨트롤 ===== */
.zoom-controls{position:absolute;bottom:16px;left:16px;display:flex;flex-direction:column;gap:4px;z-index:50}
.zoom-controls button{width:32px;height:32px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.zoom-controls button:hover{background:var(--primary);border-color:var(--primary)}
.zoom-label{text-align:center;font-size:10px;color:var(--muted)}

/* 플로우 관리 */
.flow-manager{padding:8px 16px;border-bottom:1px solid var(--border)}
.flow-manager select{width:100%;padding:6px 8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px}
.flow-manager .btn-row{display:flex;gap:4px;margin-top:6px}
.flow-manager button{flex:1;padding:5px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11px;cursor:pointer}
.flow-manager button:hover{border-color:var(--primary)}

/* 스크롤바 */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<div class="app">
  <!-- 사이드바 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>⚡ MAGI Flow</h1>
      <span class="version">v0.1</span>
    </div>

    <!-- 플로우 관리 -->
    <div class="flow-manager">
      <select id="flowSelect"><option value="">새 워크플로우</option></select>
      <div class="btn-row">
        <button onclick="newFlow()">✨ 새로</button>
        <button onclick="saveFlow()">💾 저장</button>
        <button onclick="loadFlowList()">🔄 목록</button>
      </div>
    </div>

    <!-- 노드 팔레트 -->
    <div class="node-palette" id="nodePalette"></div>

    <!-- MAGI 연결 상태 -->
    <div class="magi-status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">MAGI 연결 확인 중...</span>
    </div>
  </div>

  <!-- 캔버스 -->
  <div class="canvas-area">
    <div class="toolbar">
      <button onclick="runFlow()" class="run-btn">▶ 실행</button>
      <div class="sep"></div>
      <button onclick="clearCanvas()">🗑 초기화</button>
      <button onclick="autoLayout()">📐 정렬</button>
      <button onclick="exportFlow()">📋 복사</button>
    </div>

    <div class="canvas-container grid-bg" id="canvasContainer">
      <svg id="edgeSvg" style="width:100%;height:100%;position:absolute;top:0;left:0;z-index:5;pointer-events:none"></svg>
      <div id="nodeLayer" style="width:100%;height:100%;position:absolute;top:0;left:0;z-index:10"></div>
    </div>

    <div class="zoom-controls">
      <button onclick="zoomIn()">+</button>
      <div class="zoom-label" id="zoomLabel">100%</div>
      <button onclick="zoomOut()">-</button>
      <button onclick="zoomReset()">⊙</button>
    </div>

    <!-- 실행 결과 -->
    <div class="result-panel" id="resultPanel">
      <div class="result-header">
        <h3>📊 실행 결과</h3>
        <span class="close" onclick="closeResult()">✕</span>
      </div>
      <div class="result-body" id="resultBody"></div>
    </div>
  </div>

  <!-- 속성 패널 -->
  <div class="properties-panel" id="propsPanel">
    <div class="prop-header">
      <h3 id="propTitle">노드 속성</h3>
      <span class="close" onclick="closeProps()">✕</span>
    </div>
    <div id="propContent"></div>
  </div>
</div>

<script>
// ========================================
// 상태
// ========================================
const API = window.location.origin;
let nodes = [];
let edges = [];
let selectedNode = null;
let nodeTypes = [];
let currentFlowId = '';
let currentFlowName = '새 워크플로우';

// 캔버스 변환
let panX = 0, panY = 0, zoom = 1;
let isPanning = false, panStartX = 0, panStartY = 0;

// 드래그
let isDragging = false, dragNode = null, dragOffX = 0, dragOffY = 0;

// 엣지 생성
let isConnecting = false, connSource = null, connSourceHandle = '', tempLine = null;

// ========================================
// 초기화
// ========================================
async function init() {
  await loadNodeTypes();
  await checkMagiStatus();
  await loadFlowList();
  setupCanvasEvents();
  render();
}

async function loadNodeTypes() {
  try {
    const r = await fetch(`${API}/api/node-types`);
    const d = await r.json();
    nodeTypes = d.types || [];
    renderPalette();
  } catch(e) { console.error('노드타입 로드 실패:', e); }
}

async function checkMagiStatus() {
  try {
    const r = await fetch(`${API}/api/magi/status`);
    const d = await r.json();
    document.getElementById('statusDot').className = 'status-dot ' + (d.connected ? 'connected' : '');
    document.getElementById('statusText').textContent = d.connected ? 'MAGI 연결됨 ✓' : 'MAGI 미연결';
  } catch(e) {
    document.getElementById('statusText').textContent = 'MAGI 미연결';
  }
}

// ========================================
// 노드 팔레트
// ========================================
function renderPalette() {
  const el = document.getElementById('nodePalette');
  let html = '';
  let cat = '';
  for (const nt of nodeTypes) {
    if (nt.category !== cat) {
      cat = nt.category;
      html += `<div class="sidebar-section">${cat}</div>`;
    }
    html += `<div class="node-item" draggable="true" data-type="${nt.type}"
                  ondragstart="onPaletteDragStart(event,'${nt.type}')">
      <span class="icon">${nt.label.split(' ')[0]}</span>
      <div><div>${nt.label.split(' ').slice(1).join(' ')}</div>
      <div class="desc">${nt.description.substring(0,30)}...</div></div>
    </div>`;
  }
  el.innerHTML = html;
}

function onPaletteDragStart(e, type) {
  e.dataTransfer.setData('node-type', type);
  e.dataTransfer.effectAllowed = 'copy';
}

// ========================================
// 캔버스 이벤트
// ========================================
function setupCanvasEvents() {
  const cc = document.getElementById('canvasContainer');

  cc.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  cc.addEventListener('drop', e => {
    e.preventDefault();
    const type = e.dataTransfer.getData('node-type');
    if (!type) return;
    const rect = cc.getBoundingClientRect();
    const x = (e.clientX - rect.left - panX) / zoom;
    const y = (e.clientY - rect.top - panY) / zoom;
    addNode(type, x, y);
  });

  // 팬
  cc.addEventListener('mousedown', e => {
    if (e.target === cc || e.target.id === 'nodeLayer' || e.target.tagName === 'svg') {
      isPanning = true;
      panStartX = e.clientX - panX;
      panStartY = e.clientY - panY;
      cc.style.cursor = 'grabbing';
      if (selectedNode) { selectedNode = null; closeProps(); render(); }
    }
  });
  window.addEventListener('mousemove', e => {
    if (isPanning) {
      panX = e.clientX - panStartX;
      panY = e.clientY - panStartY;
      applyTransform();
    }
    if (isDragging && dragNode) {
      const cc2 = document.getElementById('canvasContainer').getBoundingClientRect();
      dragNode.position.x = (e.clientX - cc2.left - panX) / zoom - dragOffX;
      dragNode.position.y = (e.clientY - cc2.top - panY) / zoom - dragOffY;
      render();
    }
    if (isConnecting && tempLine) {
      const cc2 = document.getElementById('canvasContainer').getBoundingClientRect();
      const mx = (e.clientX - cc2.left - panX) / zoom;
      const my = (e.clientY - cc2.top - panY) / zoom;
      tempLine.setAttribute('d', makeCurvePath(connSource._px, connSource._py, mx, my));
    }
  });
  window.addEventListener('mouseup', e => {
    if (isPanning) { isPanning = false; cc.style.cursor = ''; }
    if (isDragging) { isDragging = false; dragNode = null; }
    if (isConnecting) { isConnecting = false; connSource = null; if (tempLine) { tempLine.remove(); tempLine = null; } }
  });

  // 줌
  cc.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.08 : 0.08;
    zoom = Math.max(0.2, Math.min(3, zoom + delta));
    applyTransform();
    document.getElementById('zoomLabel').textContent = Math.round(zoom * 100) + '%';
  }, {passive: false});
}

function applyTransform() {
  const nl = document.getElementById('nodeLayer');
  const svg = document.getElementById('edgeSvg');
  const t = `translate(${panX}px,${panY}px) scale(${zoom})`;
  nl.style.transform = t;
  nl.style.transformOrigin = '0 0';
  svg.style.transform = t;
  svg.style.transformOrigin = '0 0';
}

// ========================================
// 노드 관리
// ========================================
function addNode(type, x, y) {
  const nt = nodeTypes.find(t => t.type === type);
  if (!nt) return;
  const id = 'node_' + Date.now().toString(36) + Math.random().toString(36).substr(2,4);
  const defaultConfig = {};
  if (nt.config_schema) {
    for (const [k, v] of Object.entries(nt.config_schema)) {
      defaultConfig[k] = v.default !== undefined ? v.default : '';
    }
  }
  nodes.push({
    id, type, label: nt.label, category: nt.category || '기본',
    config: defaultConfig,
    position: { x, y }
  });
  render();
}

function deleteNode(id) {
  nodes = nodes.filter(n => n.id !== id);
  edges = edges.filter(e => e.source !== id && e.target !== id);
  if (selectedNode && selectedNode.id === id) { selectedNode = null; closeProps(); }
  render();
}

// ========================================
// 렌더링
// ========================================
function render() {
  renderNodes();
  renderEdges();
}

function renderNodes() {
  const layer = document.getElementById('nodeLayer');
  layer.innerHTML = '';
  for (const node of nodes) {
    const nt = nodeTypes.find(t => t.type === node.type);
    const div = document.createElement('div');
    div.className = 'flow-node' + (selectedNode && selectedNode.id === node.id ? ' selected' : '');
    div.setAttribute('data-category', node.category || '기본');
    div.setAttribute('data-id', node.id);
    div.style.left = node.position.x + 'px';
    div.style.top = node.position.y + 'px';

    // 상태 표시
    if (node._state === 'running') div.classList.add('running');
    if (node._state === 'done') div.classList.add('done');
    if (node._state === 'error') div.classList.add('error');

    const icon = node.label.split(' ')[0];
    const label = node.label.split(' ').slice(1).join(' ') || node.type;
    let preview = '';
    if (node.config.prompt) preview = node.config.prompt.substring(0, 40);
    else if (node.config.query) preview = node.config.query.substring(0, 40);
    else if (node.config.url) preview = node.config.url.substring(0, 40);
    else if (node.config.expression) preview = node.config.expression.substring(0, 40);
    else if (node.config.template) preview = node.config.template.substring(0, 40);

    div.innerHTML = `
      <div class="node-header">
        <span class="icon">${icon}</span>
        <span>${label}</span>
        <span class="close-btn" onclick="event.stopPropagation();deleteNode('${node.id}')">✕</span>
      </div>
      <div class="node-body">
        ${preview ? `<div class="config-preview">${escHtml(preview)}</div>` : `<span style="opacity:.5">${nt ? nt.description.substring(0,30) : ''}...</span>`}
      </div>
    `;

    // 입력 포트 (input 노드 제외)
    if (node.type !== 'input') {
      const port = document.createElement('div');
      port.className = 'port input';
      port.addEventListener('mouseup', e => { onPortMouseUp(e, node, 'input'); });
      div.appendChild(port);
    }

    // 출력 포트
    if (node.type !== 'output') {
      if (node.type === 'condition') {
        const pt = document.createElement('div');
        pt.className = 'port output-true';
        pt.title = 'True';
        pt.addEventListener('mousedown', e => { e.stopPropagation(); onPortMouseDown(e, node, 'true'); });
        div.appendChild(pt);
        const pf = document.createElement('div');
        pf.className = 'port output-false';
        pf.title = 'False';
        pf.addEventListener('mousedown', e => { e.stopPropagation(); onPortMouseDown(e, node, 'false'); });
        div.appendChild(pf);
      } else {
        const port = document.createElement('div');
        port.className = 'port output';
        port.addEventListener('mousedown', e => { e.stopPropagation(); onPortMouseDown(e, node, 'output'); });
        div.appendChild(port);
      }
    }

    // 노드 드래그
    div.addEventListener('mousedown', e => {
      if (e.target.classList.contains('port') || e.target.classList.contains('close-btn')) return;
      e.stopPropagation();
      isDragging = true;
      dragNode = node;
      const cc = document.getElementById('canvasContainer').getBoundingClientRect();
      dragOffX = (e.clientX - cc.left - panX) / zoom - node.position.x;
      dragOffY = (e.clientY - cc.top - panY) / zoom - node.position.y;
    });

    // 노드 선택 (더블클릭)
    div.addEventListener('dblclick', e => {
      e.stopPropagation();
      selectedNode = node;
      openProps(node);
      render();
    });

    layer.appendChild(div);
  }
}

function renderEdges() {
  const svg = document.getElementById('edgeSvg');
  // 기존 엣지 삭제 (임시선 제외)
  svg.querySelectorAll('.edge-line').forEach(el => el.remove());

  for (const edge of edges) {
    const srcNode = nodes.find(n => n.id === edge.source);
    const tgtNode = nodes.find(n => n.id === edge.target);
    if (!srcNode || !tgtNode) continue;

    const s = getPortPos(srcNode, edge.sourceHandle || 'output');
    const t = getPortPos(tgtNode, 'input');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', makeCurvePath(s.x, s.y, t.x, t.y));
    path.setAttribute('class', 'edge-line' + (edge._state ? ' ' + edge._state : ''));
    path.style.pointerEvents = 'stroke';
    path.addEventListener('dblclick', () => {
      edges = edges.filter(e => e.id !== edge.id);
      render();
    });
    svg.appendChild(path);
  }
}

function getPortPos(node, handle) {
  const el = document.querySelector(`.flow-node[data-id="${node.id}"]`);
  if (!el) return { x: node.position.x, y: node.position.y };
  const w = el.offsetWidth || 180;
  const h = el.offsetHeight || 80;
  if (handle === 'input') return { x: node.position.x, y: node.position.y + h/2 };
  if (handle === 'true') return { x: node.position.x + w, y: node.position.y + h * 0.35 };
  if (handle === 'false') return { x: node.position.x + w, y: node.position.y + h * 0.65 };
  return { x: node.position.x + w, y: node.position.y + h/2 };
}

function makeCurvePath(x1, y1, x2, y2) {
  const dx = Math.abs(x2 - x1) * 0.5;
  return `M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`;
}

// ========================================
// 포트 연결
// ========================================
function onPortMouseDown(e, node, handle) {
  isConnecting = true;
  const pos = getPortPos(node, handle);
  connSource = { id: node.id, handle, _px: pos.x, _py: pos.y };
  const svg = document.getElementById('edgeSvg');
  tempLine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  tempLine.setAttribute('class', 'edge-line');
  tempLine.style.stroke = 'var(--primary)';
  tempLine.style.strokeDasharray = '6 3';
  tempLine.style.pointerEvents = 'none';
  svg.appendChild(tempLine);
}

function onPortMouseUp(e, node, handle) {
  if (!isConnecting || !connSource) return;
  if (connSource.id === node.id) return; // 자기 자신 연결 불가
  // 중복 방지
  if (edges.find(e => e.source === connSource.id && e.target === node.id)) return;
  edges.push({
    id: 'edge_' + Date.now().toString(36),
    source: connSource.id,
    target: node.id,
    sourceHandle: connSource.handle,
    targetHandle: handle
  });
  isConnecting = false;
  connSource = null;
  if (tempLine) { tempLine.remove(); tempLine = null; }
  render();
}

// ========================================
// 속성 패널
// ========================================
function openProps(node) {
  const panel = document.getElementById('propsPanel');
  panel.classList.add('open');
  document.getElementById('propTitle').textContent = node.label;

  const nt = nodeTypes.find(t => t.type === node.type);
  let html = `<div class="prop-group"><label>노드 ID</label><input value="${node.id}" readonly style="opacity:.5"></div>`;
  html += `<div class="prop-group"><label>라벨</label><input value="${escHtml(node.label)}" onchange="updateNodeLabel('${node.id}',this.value)"></div>`;

  if (nt && nt.config_schema) {
    for (const [key, schema] of Object.entries(nt.config_schema)) {
      const val = node.config[key] !== undefined ? node.config[key] : (schema.default || '');
      html += `<div class="prop-group"><label>${schema.label || key}</label>`;
      if (schema.type === 'textarea') {
        html += `<textarea onchange="updateNodeConfig('${node.id}','${key}',this.value)">${escHtml(String(val))}</textarea>`;
      } else if (schema.type === 'select') {
        html += `<select onchange="updateNodeConfig('${node.id}','${key}',this.value)">`;
        for (const opt of (schema.options || [])) {
          html += `<option value="${opt}" ${val === opt ? 'selected' : ''}>${opt}</option>`;
        }
        html += `</select>`;
      } else if (schema.type === 'json') {
        html += `<textarea onchange="updateNodeConfig('${node.id}','${key}',JSON.parse(this.value||'{}'))">${escHtml(JSON.stringify(val, null, 2))}</textarea>`;
      } else {
        html += `<input type="${schema.type === 'number' ? 'number' : 'text'}" value="${escHtml(String(val))}" onchange="updateNodeConfig('${node.id}','${key}',this.value)">`;
      }
      html += `</div>`;
    }
  }

  document.getElementById('propContent').innerHTML = html;
}

function closeProps() {
  document.getElementById('propsPanel').classList.remove('open');
}

function updateNodeLabel(id, val) {
  const n = nodes.find(n => n.id === id);
  if (n) { n.label = val; render(); }
}

function updateNodeConfig(id, key, val) {
  const n = nodes.find(n => n.id === id);
  if (n) { n.config[key] = val; render(); }
}

// ========================================
// 플로우 실행
// ========================================
async function runFlow() {
  if (nodes.length === 0) return alert('노드가 없습니다!');

  // 입력값 수집
  let userInput = '';
  const inputNode = nodes.find(n => n.type === 'input');
  if (inputNode) {
    userInput = inputNode.config.value || prompt('워크플로우 입력값을 입력하세요:', '') || '';
    if (inputNode.config.value === '' || inputNode.config.value === undefined) {
      inputNode.config.value = userInput;
    }
  }

  // 상태 초기화
  nodes.forEach(n => n._state = '');
  edges.forEach(e => e._state = '');
  render();

  // 결과 패널 열기
  const rp = document.getElementById('resultPanel');
  const rb = document.getElementById('resultBody');
  rp.classList.add('open');
  rb.textContent = '⏳ 워크플로우 실행 중...\n';

  // WebSocket 실시간 실행
  const wsUrl = `ws://${window.location.host}/ws/flow/run`;
  const ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    ws.send(JSON.stringify({
      flow: { id: currentFlowId, name: currentFlowName, nodes, edges },
      inputs: { user_input: userInput }
    }));
  };

  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    switch(msg.type) {
      case 'start':
        rb.textContent += `🚀 "${msg.flow_name}" 실행 시작 (${msg.node_count}개 노드)\n`;
        break;
      case 'node_start':
        const n1 = nodes.find(n => n.id === msg.node_id);
        if (n1) n1._state = 'running';
        // 연결된 엣지도 활성화
        edges.filter(e => e.target === msg.node_id).forEach(e => e._state = 'active');
        render();
        rb.textContent += `\n▶ [${msg.label || msg.node_id}] 실행 중...\n`;
        break;
      case 'node_done':
        const n2 = nodes.find(n => n.id === msg.node_id);
        if (n2) n2._state = msg.success ? 'done' : 'error';
        edges.filter(e => e.target === msg.node_id).forEach(e => e._state = 'done');
        render();
        rb.textContent += `  ${msg.success ? '✅' : '❌'} 완료 (${msg.elapsed}s)\n`;
        if (msg.preview) rb.textContent += `  📄 ${msg.preview.substring(0,200)}\n`;
        break;
      case 'node_skip':
        rb.textContent += `  ⏭ [${msg.node_id}] 건너뜀 (조건 불일치)\n`;
        break;
      case 'complete':
        rb.textContent += `\n${'='.repeat(50)}\n`;
        rb.textContent += `✅ 완료! (총 ${msg.total_time}s)\n\n`;
        rb.textContent += `📊 최종 결과:\n${JSON.stringify(msg.outputs, null, 2)}\n`;
        break;
      case 'error':
        rb.textContent += `\n❌ 오류: ${msg.message}\n`;
        break;
    }
    rb.scrollTop = rb.scrollHeight;
  };

  ws.onerror = () => { rb.textContent += '\n❌ WebSocket 연결 실패. HTTP 모드로 전환합니다...\n'; runFlowHttp(userInput); };
}

async function runFlowHttp(userInput) {
  const rb = document.getElementById('resultBody');
  try {
    const r = await fetch(`${API}/api/flows/run`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        flow: { id: currentFlowId, name: currentFlowName, nodes, edges },
        inputs: { user_input: userInput || '' }
      })
    });
    const d = await r.json();
    rb.textContent += `\n${JSON.stringify(d, null, 2)}\n`;
    if (d.execution_log) {
      d.execution_log.forEach(log => {
        const n = nodes.find(n => n.id === log.node_id);
        if (n) n._state = log.success ? 'done' : 'error';
      });
      render();
    }
  } catch(e) { rb.textContent += `\n❌ 오류: ${e.message}\n`; }
}

function closeResult() { document.getElementById('resultPanel').classList.remove('open'); }

// ========================================
// 플로우 저장/불러오기
// ========================================
async function saveFlow() {
  const name = currentFlowName || prompt('플로우 이름:', '새 워크플로우') || '새 워크플로우';
  currentFlowName = name;
  try {
    const r = await fetch(`${API}/api/flows/save`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ id: currentFlowId, name, description: '', nodes, edges })
    });
    const d = await r.json();
    if (d.success) {
      currentFlowId = d.id;
      alert(`💾 저장 완료: ${name}`);
      loadFlowList();
    }
  } catch(e) { alert('저장 실패: ' + e.message); }
}

async function loadFlowList() {
  try {
    const r = await fetch(`${API}/api/flows`);
    const d = await r.json();
    const sel = document.getElementById('flowSelect');
    sel.innerHTML = '<option value="">새 워크플로우</option>';
    for (const f of (d.flows || [])) {
      sel.innerHTML += `<option value="${f.id}" ${f.id === currentFlowId ? 'selected' : ''}>${f.name} (${f.nodes}개 노드)</option>`;
    }
    sel.onchange = () => {
      if (sel.value) loadFlow(sel.value);
      else newFlow();
    };
  } catch(e) { console.error(e); }
}

async function loadFlow(id) {
  try {
    const r = await fetch(`${API}/api/flows/${id}`);
    const d = await r.json();
    if (d.success && d.flow) {
      nodes = d.flow.nodes || [];
      edges = d.flow.edges || [];
      currentFlowId = d.flow.id;
      currentFlowName = d.flow.name;
      render();
    }
  } catch(e) { alert('불러오기 실패: ' + e.message); }
}

function newFlow() {
  nodes = [];
  edges = [];
  currentFlowId = '';
  currentFlowName = '새 워크플로우';
  selectedNode = null;
  closeProps();
  render();
}

function clearCanvas() {
  if (confirm('모든 노드를 삭제하시겠습니까?')) newFlow();
}

function autoLayout() {
  if (nodes.length === 0) return;
  // 간단한 자동 레이아웃: 토폴로지 순서대로 배치
  const deps = {};
  nodes.forEach(n => deps[n.id] = []);
  edges.forEach(e => { if (deps[e.target]) deps[e.target].push(e.source); });
  const inDeg = {};
  nodes.forEach(n => inDeg[n.id] = (deps[n.id] || []).length);
  const queue = nodes.filter(n => inDeg[n.id] === 0).map(n => n.id);
  const order = [];
  while (queue.length) {
    const id = queue.shift();
    order.push(id);
    edges.filter(e => e.source === id).forEach(e => {
      inDeg[e.target]--;
      if (inDeg[e.target] === 0) queue.push(e.target);
    });
  }
  // 미포함 노드 추가
  nodes.forEach(n => { if (!order.includes(n.id)) order.push(n.id); });

  const cols = {};
  order.forEach((id, i) => {
    const level = getLevel(id, deps);
    if (!cols[level]) cols[level] = [];
    cols[level].push(id);
  });

  for (const [col, ids] of Object.entries(cols)) {
    ids.forEach((id, row) => {
      const n = nodes.find(n => n.id === id);
      if (n) {
        n.position.x = parseInt(col) * 280 + 60;
        n.position.y = row * 120 + 60;
      }
    });
  }
  render();
}

function getLevel(id, deps, memo = {}) {
  if (memo[id] !== undefined) return memo[id];
  const sources = deps[id] || [];
  if (sources.length === 0) { memo[id] = 0; return 0; }
  const level = 1 + Math.max(...sources.map(s => getLevel(s, deps, memo)));
  memo[id] = level;
  return level;
}

function exportFlow() {
  const data = JSON.stringify({ name: currentFlowName, nodes, edges }, null, 2);
  navigator.clipboard.writeText(data).then(() => alert('📋 플로우 JSON이 클립보드에 복사되었습니다!')).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = data;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    alert('📋 복사 완료!');
  });
}

// ========================================
// 줌
// ========================================
function zoomIn() { zoom = Math.min(3, zoom + 0.15); applyTransform(); document.getElementById('zoomLabel').textContent = Math.round(zoom*100)+'%'; }
function zoomOut() { zoom = Math.max(0.2, zoom - 0.15); applyTransform(); document.getElementById('zoomLabel').textContent = Math.round(zoom*100)+'%'; }
function zoomReset() { zoom = 1; panX = 0; panY = 0; applyTransform(); document.getElementById('zoomLabel').textContent = '100%'; }

// ========================================
// 유틸
// ========================================
function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// 키보드 단축키
document.addEventListener('keydown', e => {
  if (e.key === 'Delete' && selectedNode) { deleteNode(selectedNode.id); }
  if (e.key === 'Escape') { closeProps(); selectedNode = null; render(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveFlow(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runFlow(); }
});

// 시작
init();
</script>
