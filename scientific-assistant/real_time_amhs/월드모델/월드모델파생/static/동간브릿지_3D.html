<!--
  ★이 화면의 3D 는 **월드모델파생이 이미 쓰고 있는 아이소메트리 그대로**다
    (static/js/oht3d/oht3d.js · three.js r169). 새로 그리지 않았다 —
    레일·행거·설비·차량·툴바·마우스 돌리기·HID Zone 패널이 전부 그것이다.
    고객: "그냥 기존에 사용하던 아이소메트리 하면 되잖아, 잘 만들어 둔 걸 왜 안 써."

  달라진 것 하나 — oht3d 의 노드에 **높이(z)** 를 넣었다. 예전엔 {id,x,y} 뿐이라
  동을 전부 한 바닥에 깔 수밖에 없었다(고객: "건물마다 틀린데 왜 한 판에 전부
  다 그리냐"). 이제 M14B 는 7F, M14A 는 3F, HUB, M16 6F·2F 가 제 높이에 서고
  브릿지가 층과 층 사이를 비스듬히 잇는다. ★z 를 안 주면 0 이라 기존 화면은
  하나도 안 바뀐다.

  브릿지3D_만들기.py 가 도면에서 레일을 뽑아 이 틀에 끼운다.
-->

y": "M16HUB", "zone": "HUB · M16", "col": "#8fd3ff", "w": 190, "h": 79.0, "z": 22.4}, {"key": "M16A", "zone": "6F · M16 6F", "col": "#ffce7a", "w": 210, "h": 63.0, "z": 89.6}, {"key": "M16B", "zone": "2F · M16 2F", "col": "#ff8f8f", "w": 210, "h": 66.9, "z": 0.0}], "bridges": [{"id": "M14LFT", "frm": "M14B", "to": "M16 HUB", "col": "#3ad6c8"}, {"id": "M14CNV", "frm": "M14A CNV", "to": "M16 HUB", "col": "#3ad6c8"}, {"id": "M16LFT", "frm": "M16 HUB", "to": "M16 6F", "col": "#ffce7a"}, {"id": "M16LFT2F", "frm": "M16 HUB", "to": "M16 2F", "col": "#ff6b6b"}, {"id": "M16EUV", "frm": "M16 LFT", "to": "M16 2F", "col": "#8fd3ff"}], "vperzone": 16};
const $ = i => document.getElementById(i);

/* ── 3D — 월드모델파생 아이소메트리 **그대로** ──────────────────── */
const v3d = await createOHT3D($('stage'), {
  THREE,
  coordScale: 1,          // 이미 m 로 만들어 넘긴다
  flipY: true,
  projection: 'iso',      // 등각으로 연다 (바 단추로 원근 전환 가능)
  dark: true,
  walls: false,           // 벽 안 세운다 (고객 지시)
  ports: true,
  ui: true,               // ★뷰어 제 툴바·범례·툴팁 그대로
  panel: true, panelOpen: false,
  sizeUI: true,           // '크기' 판 — 레일·차량·설비·글자 배수
  colors: { background: '#080c12' },
  /* ★동이 저마다 제 높이에 떠 있으니 바닥판·격자는 오히려 방해다.
     (한 바닥에 깔던 시절의 것) */
  floor: false,
  /* 무대가 800m x 400m 다 — 한 FAB(200m) 기준 기본값이면 화면에서 안 보인다 */
  railScale: 2.0, vehicleScale: 1.8, portScale: 1.1, textScale: 0.8,
});
v3d.setLayout({ nodes: D.nodes, edges: D.edges, zones: D.zones, ports: D.ports });
v3d.viewAll();
$('boot').remove();

/* ── 오른쪽 패널 ────────────────────────────────────────────────── */
const VAL = {};                     // ★숫자는 여기 없다 — 피드가 꽂을 자리
D.bridges.forEach(b => VAL[b.id] = { cur: null, ref: null });
const OVER = 1.5;                   // ★위험으로 볼 선 — 현장 규칙이 오면 이 한 줄
function side() {
  $('bridges').innerHTML = D.bridges.map(b => {
    const v = VAL[b.id], hot = v.cur != null && v.ref && v.cur / v.ref >= OVER;
    return `<div class="row${hot ? ' over' : ''}" data-zone="브릿지 · ${b.id}">
      <i style="background:${b.col}"></i>
      <div class="t"><b>${b.id}</b><s>${b.frm} ▸ ${b.to}</s></div>
      <div class="v">${v.cur ?? '–'}<em> / ${v.ref ?? '–'}</em></div></div>`;
  }).join('');
  $('fabs').innerHTML = D.fabs.map(f => `<div class="row" data-zone="${f.zone}">
      <i style="background:${f.col}"></i>
      <div class="t"><b>${f.zone}</b><s>${f.w}m × ${Math.round(f.h)}m · 높이 ${f.z}m</s></div>
      <div class="v" data-fab="${f.key}">–</div></div>`).join('');
  document.querySelectorAll('[data-zone]').forEach(el =>
    el.onclick = () => v3d.focusZone(el.dataset.zone));   // 눌러서 그 동으로
}
side();
globalThis.OHTBridge = {
  set(id, o) { if (VAL[id]) { Object.assign(VAL[id], o || {}); side(); } },
  clear() { Object.keys(VAL).forEach(k => VAL[k] = { cur: null, ref: null }); side(); },
  view: v3d, bridges: D.bridges.map(b => b.id),
};

/* ── 차 — 보기용. 실제는 재생 프레임이 setVehicles 로 준다 ───────── */
const CARS = [];
let vid = 0;
for (const z of D.zones) {
  const n = z.id.startsWith('브릿지') ? 5 : D.vperzone;
  for (let i = 0; i < n; i++)
    CARS.push({ id: 'V' + (++vid), edge: z.edges[(i * 5) % z.edges.length],
                ratio: Math.random(), sp: 0.05 + Math.random() * 0.05,
                state: i % 7 === 3 ? 1 : 0, zone: z.id });
}
const HOT = D.bridges.find(b => b.id === 'M16LFT2F');
if (HOT) CARS.filter(c => c.zone === '브릿지 · ' + HOT.id)
  .forEach((c, i) => { c.state = i % 2 ? 3 : 2; c.sp = 0; });

function tick() {
  for (const c of CARS) if (c.sp) { c.ratio += c.sp * 0.25; if (c.ratio > 1) c.ratio -= 1; }
  v3d.setVehicles(CARS.map(c => ({
    id: c.id, edge: c.edge, ratio: c.ratio, state: c.state,
    speed_mpm: Math.round(c.sp * 1800), loaded: c.state === 1 ? 1 : 0 })));
  const cnt = {};
  for (const c of CARS) cnt[c.zone] = (cnt[c.zone] || 0) + 1;
  document.querySelectorAll('[data-fab]').forEach(el => {
    const f = D.fabs.find(x => x.key === el.dataset.fab);
    el.textContent = cnt[f.zone] ?? '–';
  });
  $('kTransit').textContent = CARS.filter(c => c.sp).length;
  $('kFab').textContent = D.fabs.length;
  $('kAlarm').textContent = CARS.some(c => c.state >= 2) ? 1 : 0;
}
tick(); setInterval(tick, 250);

const clock = () => { const d = new Date();
  $('kClock').textContent = String(d.getHours()).padStart(2, '0') + ':'
                          + String(d.getMinutes()).padStart(2, '0'); };
clock(); setInterval(clock, 10000);
$('alarmTxt').textContent = HOT
  ? `${HOT.id} 구간에 정지·JAM 차량이 있습니다 — ${HOT.frm} ▸ ${HOT.to}`
  : '없음';
</script>
