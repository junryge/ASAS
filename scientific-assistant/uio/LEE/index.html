<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEE - Draw.io 에이전트</title>
  <style>
    :root {
      --bg: #0f1f15;
      --panel: #152a1c;
      --card: #1e3826;
      --accent: #4ade80;
      --accent2: #16a34a;
      --text: #e6f5ec;
      --muted: #7daa8e;
      --success: #2ecc71;
      --border: #2a5a3a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: var(--panel);
      border-bottom: 2px solid var(--border);
      padding: 16px 24px;
      display: flex; align-items: center; gap: 16px;
    }
    .header .avatar {
      width: 48px; height: 48px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: grid; place-items: center;
      font-size: 22px; font-weight: 700; color: #0f1f15;
    }
    .header .info h1 { font-size: 20px; }
    .header .info p { font-size: 13px; color: var(--muted); }
    .header .status {
      margin-left: auto;
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--success);
    }
    .header .status::before {
      content: ''; width: 8px; height: 8px; border-radius: 50%;
      background: var(--success); animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .main { flex:1; display:grid; grid-template-columns:280px 1fr; overflow:hidden; }

    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 20px; overflow-y: auto;
    }
    .sidebar h3 {
      font-size: 13px; text-transform: uppercase;
      letter-spacing: 1px; color: var(--muted); margin-bottom: 12px;
    }
    .tool-list { list-style: none; }
    .tool-list li {
      padding: 10px 12px; border-radius: 8px; margin-bottom: 6px;
      cursor: pointer; transition: background 0.2s;
      display: flex; align-items: center; gap: 10px; font-size: 14px;
    }
    .tool-list li:hover { background: var(--card); }
    .tool-list li .icon {
      width: 32px; height: 32px; border-radius: 6px;
      background: var(--card); display: grid; place-items: center; font-size: 16px;
    }
    .tool-list li.active { background: rgba(74,222,128,0.15); border: 1px solid rgba(74,222,128,0.3); }

    .shape-palette { margin-top: 24px; }
    .shapes {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    .shape-item {
      aspect-ratio: 1;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      display: grid; place-items: center;
      font-size: 24px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .shape-item:hover { border-color: var(--accent); background: rgba(74,222,128,0.1); }

    .content { display: flex; flex-direction: column; overflow: hidden; }

    /* Canvas Area */
    .canvas-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .canvas-toolbar {
      padding: 8px 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex; gap: 8px; align-items: center;
    }
    .canvas-toolbar button {
      padding: 6px 12px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--text); font-size: 12px; cursor: pointer;
      font-family: inherit; transition: all 0.2s;
    }
    .canvas-toolbar button:hover { border-color: var(--accent); }

    .draw-canvas {
      flex: 1;
      background: #fff;
      margin: 16px 24px;
      border-radius: 12px;
      border: 2px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .draw-canvas .placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #999;
      font-size: 16px;
    }
    .draw-canvas .placeholder .inner {
      text-align: center;
    }
    .draw-canvas .placeholder .big-icon {
      font-size: 64px;
      margin-bottom: 12px;
      display: block;
    }

    .chat-area { padding: 16px 24px; max-height: 250px; overflow-y: auto; }
    .message { margin-bottom: 12px; display: flex; gap: 12px; }
    .message .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--card); display: grid; place-items: center;
      font-size: 14px; flex-shrink: 0;
    }
    .message .msg-avatar.agent { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .message .msg-body {
      background: var(--card); border-radius: 10px;
      padding: 10px 14px; max-width: 70%; font-size: 13px; line-height: 1.5;
    }
    .message.user { flex-direction: row-reverse; }
    .message.user .msg-body { background: var(--accent2); }

    .input-bar {
      padding: 12px 24px; background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex; gap: 12px; align-items: center;
    }
    .input-bar input {
      flex: 1; padding: 10px 14px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--text); font-size: 14px; font-family: inherit; outline: none;
    }
    .input-bar input:focus { border-color: var(--accent); }
    .input-bar input::placeholder { color: var(--muted); }
    .input-bar button {
      padding: 10px 18px; border-radius: 10px; border: none;
      background: var(--accent); color: #0f1f15;
      font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .input-bar button:hover { background: var(--accent2); color: #fff; }
  </style>
</head>
<body>

  <div class="header">
    <div class="avatar">L</div>
    <div class="info">
      <h1>LEE - Draw.io 에이전트</h1>
      <p>다이어그램 생성 / 플로우차트 / 시스템 아키텍처 / .drawio 파일 생성</p>
    </div>
    <div class="status">대기 중</div>
  </div>

  <div class="main">
    <div class="sidebar">
      <h3>다이어그램 도구</h3>
      <ul class="tool-list">
        <li class="active">
          <div class="icon">🔀</div>
          <div>플로우차트</div>
        </li>
        <li>
          <div class="icon">🏗️</div>
          <div>시스템 아키텍처</div>
        </li>
        <li>
          <div class="icon">🔄</div>
          <div>시퀀스 다이어그램</div>
        </li>
        <li>
          <div class="icon">📐</div>
          <div>ER 다이어그램</div>
        </li>
        <li>
          <div class="icon">🌐</div>
          <div>네트워크 구성도</div>
        </li>
        <li>
          <div class="icon">📥</div>
          <div>.drawio 다운로드</div>
        </li>
      </ul>

      <div class="shape-palette">
        <h3>도형 팔레트</h3>
        <div class="shapes">
          <div class="shape-item">▭</div>
          <div class="shape-item">◇</div>
          <div class="shape-item">⬭</div>
          <div class="shape-item">▱</div>
          <div class="shape-item">⬡</div>
          <div class="shape-item">☁</div>
          <div class="shape-item">⏣</div>
          <div class="shape-item">🔲</div>
          <div class="shape-item">↗</div>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="canvas-area">
        <div class="canvas-toolbar">
          <button>확대</button>
          <button>축소</button>
          <button>맞춤</button>
          <button>실행취소</button>
          <button>다시실행</button>
          <button style="margin-left:auto;">내보내기 (.drawio)</button>
        </div>
        <div class="draw-canvas">
          <div class="placeholder">
            <div class="inner">
              <span class="big-icon">📐</span>
              <div>다이어그램 요청을 입력하면<br>이곳에 Draw.io 다이어그램이 생성됩니다</div>
            </div>
          </div>
        </div>
      </div>

      <div class="chat-area" id="chatArea"></div>

      <div class="input-bar">
        <input type="text" id="userInput" placeholder="다이어그램 요청을 입력하세요... (예: 데이터 파이프라인 플로우차트 만들어줘)"
               onkeydown="if(event.key==='Enter') sendMsg()" />
        <button onclick="sendMsg()">생성 요청</button>
      </div>
    </div>
  </div>

  <script>
    function sendMsg() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;
      const chatArea = document.getElementById('chatArea');
      chatArea.innerHTML += `
        <div class="message user">
          <div class="msg-avatar">👤</div>
          <div class="msg-body">${escapeHtml(text)}</div>
        </div>`;
      input.value = '';
      setTimeout(() => {
        chatArea.innerHTML += `
          <div class="message">
            <div class="msg-avatar agent">L</div>
            <div class="msg-body">
              다이어그램 생성 요청 접수: <strong>"${escapeHtml(text)}"</strong><br>
              ⏳ 백엔드 연결 후 .drawio 파일이 생성됩니다.
            </div>
          </div>`;
        chatArea.scrollTop = chatArea.scrollHeight;
      }, 500);
      chatArea.scrollTop = chatArea.scrollHeight;
    }
    function escapeHtml(t) {
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }
  </script>
</body>
</html>
