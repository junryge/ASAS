name: "Data Pipeline"
description: "Build a data processing pipeline with ETL steps, validation, and output."
model: auto
max_tokens: 8192
parameters:
  - name: "source"
    description: "Data source (CSV, API, database, JSON)"
  - name: "transformations"
    description: "Transformations to apply (clean, filter, aggregate, join)"
  - name: "output"
    description: "Output format (CSV, database, dashboard, report)"
instructions: |
  Design a data pipeline that:
  - Source: {{source}}
  - Transformations: {{transformations}}
  - Output: {{output}}

  Provide:
  1. **Architecture Diagram** (ASCII/Mermaid)
  2. **Python Code** - Complete, runnable pipeline
  3. **Data Validation** - Schema checks, null handling, type coercion
  4. **Error Handling** - Retry logic, logging, alerting
  5. **Monitoring** - Progress tracking, metrics

  Use pandas/polars for data processing. Include proper logging.
